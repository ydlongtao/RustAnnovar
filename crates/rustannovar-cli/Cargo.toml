[package]
name = "rustannovar-cli"
version = "0.2.0-beta.2"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tempfile = "3"
rustannovar-core = { path = "../rustannovar-core" }
rustannovar-vcf = { path = "../rustannovar-vcf" }
rustannovar-db = { path = "../rustannovar-db" }
rustannovar-filter = { path = "../rustannovar-filter" }

[[bin]]
name = "rustannovar"
path = "src/main.rs"
