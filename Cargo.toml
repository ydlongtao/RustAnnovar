[package]
name = "rust-annovar"
version = "0.2.0-beta.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A fast, auditable Rust implementation of core ANNOVAR workflows"
repository = "https://github.com/ydlongtao/RustAnnovar"
homepage = "https://github.com/ydlongtao/RustAnnovar"
readme = "README.md"
rust-version = "1.85"
keywords = ["annovar", "bioinformatics", "genomics", "variant-annotation"]
categories = ["science", "command-line-utilities"]

[lib]
name = "rust_annovar"
path = "src/lib.rs"

[[bin]]
name = "rust-annovar"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls"] }

tempfile = "3"

[dev-dependencies]
